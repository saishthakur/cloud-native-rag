[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudrag"
version = "0.1.0"
description = "CloudRAG: a cloud-native, microservices-based, multi-tenant retrieval-augmented generation platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Aaryan Sanjay Paranjape" },
  { name = "Aryan Chandra" },
  { name = "S. Badri Narayana" },
  { name = "Saish Hitesh Thakur" },
]
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.6",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
]

[project.optional-dependencies]
redis = ["redis>=5.0"]
anthropic = ["anthropic>=2.0"]
models = ["sentence-transformers>=3.0"]
dev = ["pytest>=8.0", "fakeredis>=2.20"]
all = ["redis>=5.0", "anthropic>=2.0", "pytest>=8.0", "fakeredis>=2.20"]

[project.scripts]
cloudrag = "cloudrag.cli:main"

[tool.setuptools.packages.find]
include = ["cloudrag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
