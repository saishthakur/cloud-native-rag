global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: cloudrag
    metrics_path: /metrics
    static_configs:
      - targets:
          - gateway:8000
          - ingestion:8001
          - embedding:8002
          - indexing-0:8003
          - indexing-1:8003
          - retrieval:8004
          - reranker:8005
          - generation:8006
