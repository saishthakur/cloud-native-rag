# Indexing shards. Each pod owns the tenants that hash to its ordinal (indexing-0, indexing-1, ...),
# consumes the ingestion stream with its own consumer group, and persists namespace snapshots plus
# the last processed stream id on its volume so a restarted pod replays only what it missed.
# Scaling out = raise replicas AND CLOUDRAG_SHARD_COUNT / CLOUDRAG_INDEXING_URLS together, then
# re-ingest (or migrate snapshots of) the tenants whose shard changed.
apiVersion: v1
kind: Service
metadata:
  name: indexing
  labels: { app.kubernetes.io/name: indexing, app.kubernetes.io/part-of: cloudrag }
spec:
  clusterIP: None                      # headless: stable per-pod DNS indexing-N.indexing
  selector: { app.kubernetes.io/name: indexing }
  ports: [{ name: http, port: 8003, targetPort: http }]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudrag-indexing
  labels: { app.kubernetes.io/part-of: cloudrag }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: indexing
  labels: { app.kubernetes.io/name: indexing, app.kubernetes.io/part-of: cloudrag }
spec:
  serviceName: indexing
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels: { app.kubernetes.io/name: indexing }
  template:
    metadata:
      labels: { app.kubernetes.io/name: indexing, app.kubernetes.io/part-of: cloudrag, app.kubernetes.io/version: "0.1.0" }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "8003", prometheus.io/path: /metrics }
    spec:
      serviceAccountName: cloudrag-indexing
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60  # time to write a final snapshot
      securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector: { matchLabels: { app.kubernetes.io/name: indexing } }
      containers:
        - name: indexing
          image: cloudrag:0.1.0
          args: ["indexing"]
          ports: [{ name: http, containerPort: 8003 }]
          env:
            - { name: PORT, value: "8003" }
            - { name: CLOUDRAG_SERVICE_NAME, value: indexing }
            # HOSTNAME (indexing-N) supplies the shard ordinal when CLOUDRAG_SHARD_ORDINAL is unset
          envFrom:
            - configMapRef: { name: cloudrag-config }
            - secretRef: { name: cloudrag-secrets }
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 5, failureThreshold: 3 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 10, failureThreshold: 6 }
          startupProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 5, failureThreshold: 60 }
          resources:
            requests: { cpu: "1", memory: 2Gi }
            limits: { memory: 8Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts: [{ name: data, mountPath: /data }, { name: tmp, mountPath: /tmp }]
      volumes:
        - { name: tmp, emptyDir: {} }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 50Gi } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: indexing
spec:
  maxUnavailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: indexing }
