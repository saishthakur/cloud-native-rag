# Stateless CloudRAG services: Service + Deployment + HorizontalPodAutoscaler + PodDisruptionBudget each.
# Generated from one template so every service gets the same probes, security context and scaling policy.
---
# gateway: public API: auth, rate limits, input filtering, orchestration, audit
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels: { app.kubernetes.io/name: gateway, app.kubernetes.io/part-of: cloudrag }
spec:
  selector: { app.kubernetes.io/name: gateway }
  ports: [{ name: http, port: 8000, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels: { app.kubernetes.io/name: gateway, app.kubernetes.io/part-of: cloudrag }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector:
    matchLabels: { app.kubernetes.io/name: gateway }
  template:
    metadata:
      labels: { app.kubernetes.io/name: gateway, app.kubernetes.io/part-of: cloudrag, app.kubernetes.io/version: "0.1.0" }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "8000", prometheus.io/path: /metrics }
    spec:
      serviceAccountName: cloudrag-gateway
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app.kubernetes.io/name: gateway } }
      containers:
        - name: gateway
          image: cloudrag:0.1.0
          args: ["gateway"]
          ports: [{ name: http, containerPort: 8000 }]
          env:
            - { name: PORT, value: "8000" }
            - { name: CLOUDRAG_SERVICE_NAME, value: gateway }
          envFrom:
            - configMapRef: { name: cloudrag-config }
            - secretRef: { name: cloudrag-secrets }
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 5, failureThreshold: 3 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 10, failureThreshold: 6 }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts: [{ name: data, mountPath: /data }, { name: tmp, mountPath: /tmp }]
      volumes:
        - { name: data, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudrag-gateway
  labels: { app.kubernetes.io/part-of: cloudrag }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: gateway }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
  behavior:
    scaleUp: { stabilizationWindowSeconds: 0, policies: [{ type: Percent, value: 100, periodSeconds: 30 }] }
    scaleDown: { stabilizationWindowSeconds: 300, policies: [{ type: Percent, value: 25, periodSeconds: 60 }] }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: gateway }
---
